name: Keep Supabase Alive

on:
  schedule:
    # Runs every 5 days at 08:00 UTC (well within the 7-day pause window)
    - cron: '0 8 */5 * *'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Upsert heartbeat row to prevent auto-pause
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/keep_alive?on_conflict=id" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -X POST \
            -d '{"id": 1, "pinged_at": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"}')
          echo "HTTP status: $response"
          if [ "$response" -ne 200 ] && [ "$response" -ne 201 ]; then
            echo "::error::Supabase heartbeat failed with status $response"
            exit 1
          fi
          echo "Supabase heartbeat successful"
